


# This workflow builds the application and can also be manually triggered
# with Maven arguments, environment, and branch inputs.

name: CI_versions2

on:
  # Trigger on push to main
  push:
    branches:
      - main

  # Trigger on pull request to main
  pull_request:
    branches:
      - main

  # Manual trigger
  workflow_dispatch:
    inputs:
      mavenArgs:
        description: 'Additional Maven command arguments, goals, plugins, etc.'
        required: false
        default: ''
        type: string

      environment:
        description: 'Deployment environment: dev / QA / preprod / prod'
        required: false
        default: 'dev'
        type: string

      branch:
        description: 'Branch to build/deploy'
        required: false
        default: 'main'
        type: string

jobs:

  # Build job
  build:
    name: Build Java Application
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      # Set up Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Display selected inputs
      - name: Display workflow inputs
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Maven Arguments: ${{ github.event.inputs.mavenArgs }}"
          echo "Branch: ${{ github.event.inputs.branch }}"

      
      # Build application
      - name: Build with Maven
        run: |
          mvn clean install ${{ github.event.inputs.mavenArgs }}
      - name: Build with Maven
        run: |
          mvn clean install ${{ github.event.inputs.mavenArgs }}
